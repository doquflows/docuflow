      .bg{fill:#0d1117}
      .grid{stroke:#30363d}
      .axis{stroke:#3d444d}
      .lbl{fill:#9198a1}
      .legend{fill:#e6edf3}
      .foot{fill:#7d8590}
      .dot{stroke:#0d1117}
    }
  ]]></style>
